<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover makes iPhone report the home-indicator inset, which the tab bar pads itself by. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!--
      Home-screen install (stories 75-77). The paths are absolute and carry the GitHub
      Pages project path, because a deep link such as /BadmiGo/game/<id> would resolve a
      relative one under /game/. Keep /BadmiGo in step with experiments.baseUrl in app.json.
    -->
    <link rel="manifest" href="/BadmiGo/manifest.json" />
    <link rel="apple-touch-icon" href="/BadmiGo/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ladder" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#EEF2EF" />
    <link rel="stylesheet" href="/BadmiGo/fonts/fonts.css" />
    <!--
      Runs before the app arrives, so a phone that chose dark (Settings, kept under the
      same key as src/ui/theme.ts) never flashes the light floor first.
    -->
    <script>
      if (localStorage.getItem('badmigo.scheme') === 'dark') {
        document.documentElement.className = 'dark';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0C1612');
      }
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #EEF2EF;
      }
      html.dark,
      html.dark body {
        background-color: #0C1612;
        color-scheme: dark;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
